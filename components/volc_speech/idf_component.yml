## volc_speech —— 火山引擎流式语音（ASR/TTS）设备端直连组件的自有依赖。
dependencies:
  # WSS 客户端（TLS 走 esp-tls + 证书包，sdkconfig 已开 MBEDTLS_CERTIFICATE_BUNDLE）
  espressif/esp_websocket_client: ^1.2.0
  # gzip 压缩/解压（火山 v3 二进制协议 payload 压缩）
  espressif/zlib: ^1.3.0
  # 端上 Ogg/Opus 流式解码（TTS 下行 ogg_opus → 16kHz PCM）。自带 libopus +
  # micro-ogg-demuxer，容器拆包+解码一体；Xtensa 优化在 P4(RISC-V) 自动关走通用路径。
  esphome/micro-opus: ^0.4.1
  idf: '>=5.5.2'
